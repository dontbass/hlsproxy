<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HLS Proxy — анти-фриз</title>
<style>
.viz-root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb; --surface-2: #f0efec;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-7: #6250d6;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --good-text: #006300; --info: #898781;
  --wash-warning: rgba(250,178,25,0.16); --wash-critical: rgba(208,59,59,0.14); --wash-hold: rgba(98,80,214,0.12);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19; --surface-2: #242423;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-7: #9085e9;
    --good-text: #0ca30c;
    --wash-warning: rgba(250,178,25,0.13); --wash-critical: rgba(208,59,59,0.20); --wash-hold: rgba(144,133,233,0.16);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.viz-root { background: var(--page); color: var(--text-primary); min-height: 100vh; padding: 16px; }
h1 { font-size: 18px; margin: 0; font-weight: 600; }
h2 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
.muted { color: var(--text-muted); }
.sec { color: var(--text-secondary); }
.top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.pill { border: 1px solid var(--border); border-radius: 999px; padding: 1px 10px; font-size: 12px; color: var(--text-secondary); background: var(--surface-1); }
.layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.ch { cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
.ch[aria-current="true"] { outline: 2px solid var(--series-1); outline-offset: -1px; }
.ch .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-primary); }
.status i { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700; color: #fff; flex: none; }
.lv-good i { background: var(--good); } .lv-warning i { background: var(--warning); color: #0b0b0b; }
.lv-serious i { background: var(--serious); } .lv-critical i { background: var(--critical); } .lv-info i { background: var(--info); }
.detail { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.verdict-title { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.verdict-title i { width: 24px; height: 24px; font-size: 14px; }
ul.reasons { margin: 8px 0 0; padding-left: 18px; color: var(--text-secondary); }
ul.reasons li { margin: 4px 0; }
.rec { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; }
.rec b { font-weight: 600; }
button.btn { font: inherit; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
button.btn.primary { background: var(--series-1); border-color: transparent; color: #fff; }
button.btn:disabled { opacity: .5; cursor: default; }
input.num { width: 72px; font: inherit; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-1); color: var(--text-primary); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile .lb { font-size: 12px; color: var(--text-secondary); }
.tile .vl { font-size: 22px; font-weight: 600; margin-top: 2px; }
.tile .sub { font-size: 12px; color: var(--text-muted); }
.meter { position: relative; height: 64px; margin-top: 4px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin: 2px 0 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key-line { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
.key-rect { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; min-width: 140px; }
.tip .row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tip .row b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tip .hd { color: var(--text-muted); margin-bottom: 4px; }
.events { max-height: 320px; overflow: auto; font-size: 13px; }
.ev { display: grid; grid-template-columns: 64px 18px 1fr; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--grid); }
.ev:last-child { border-bottom: 0; }
.ev .tm { color: var(--text-muted); font-variant-numeric: tabular-nums; }
table.data { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
table.data th, table.data td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--grid); }
table.data th { color: var(--text-secondary); font-weight: 500; }
details summary { cursor: pointer; color: var(--text-secondary); }
.empty { padding: 40px; text-align: center; color: var(--text-secondary); }
.stale { opacity: .55; transition: opacity .2s; }
.marks .mk { padding: 8px 0; border-bottom: 1px solid var(--grid); }
.marks .mk:last-child { border-bottom: 0; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.banner { background: var(--surface-2); border-radius: 8px; padding: 8px 12px; color: var(--text-secondary); }
.sess { cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; padding: 8px 10px; }
.sess[aria-current="true"] { outline: 2px solid var(--series-1); outline-offset: -1px; }
.side-h { font-size: 12px; color: var(--text-secondary); margin: 10px 2px 2px; display: flex; justify-content: space-between; }
a { color: var(--series-1); }
.qhero { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.qscore { text-align: center; min-width: 120px; }
.qscore .num { font-size: 48px; font-weight: 600; line-height: 1; }
.qscore .of { color: var(--text-muted); font-size: 13px; }
.qscore .status { margin-top: 6px; font-size: 14px; }
.qrow { display: grid; grid-template-columns: 110px 1fr 230px; gap: 10px; align-items: center; margin: 6px 0; }
.qrow .lb { color: var(--text-secondary); font-size: 13px; }
.qrow .vl { font-size: 13px; text-align: right; }
.scale { position: relative; height: 14px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.scale .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.scale .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--surface-1); }
.scalelabels { position: relative; height: 14px; font-size: 10px; color: var(--text-muted); }
.scalelabels span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font-size: 12px; color: var(--text-secondary); background: var(--surface-1); }
.chip b { color: var(--text-primary); font-weight: 600; }
.tierbadge { display: inline-block; font-weight: 700; font-size: 12px; padding: 1px 7px; border-radius: 5px; background: var(--text-primary); color: var(--surface-1); letter-spacing: .02em; }
.factors { margin: 8px 0 0; padding-left: 18px; color: var(--text-secondary); font-size: 13px; }
.strip { display: flex; gap: 2px; height: 22px; margin-top: 6px; }
.strip { overflow: hidden; }
.strip i { flex: 1 1 0; min-width: 0; border-radius: 2px; }
.viewer { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--grid); font-size: 13px; align-items: center; }
.viewer:last-child { border-bottom: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.sysbar { display: flex; gap: 6px; flex-wrap: wrap; margin: -4px 0 12px; }
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.chscore { font-variant-numeric: tabular-nums; font-weight: 600; }
@media (max-width: 700px) {
  .viz-root { padding: 10px; }
  h1 { font-size: 16px; }
  .layout { gap: 10px; }
  .list { flex-direction: row; overflow-x: auto; gap: 8px; padding-bottom: 4px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  .list > .card { min-width: 230px; max-width: 260px; scroll-snap-align: start; flex: none; }
  .list .side-h { display: none; }
  .card { padding: 12px; border-radius: 10px; }
  .tiles { grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile .vl { font-size: 18px; }
  .verdict-title { font-size: 17px; }
  .qhero { grid-template-columns: 1fr; gap: 8px; }
  .qscore { display: flex; align-items: baseline; gap: 10px; text-align: left; }
  .qscore .num { font-size: 40px; }
  .qrow { grid-template-columns: 1fr; gap: 3px; }
  .qrow .vl { text-align: left; }
  .rec { gap: 8px; }
  .rec .btn { flex: 1 1 auto; }
  .btnrow .btn { flex: 1 1 40%; padding: 9px 8px; }
  .ev { grid-template-columns: 56px 18px 1fr; font-size: 12px; }
  .legend { gap: 8px; font-size: 11px; }
  .top { gap: 8px; }
  .sysbar { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
  .sysbar .pill { flex: none; }
  .strip { gap: 1px; }
  .detail, .card, .layout > * { min-width: 0; }
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 1200px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="viz-root">
  <div class="top">
    <h1>HLS Proxy · анти-фриз</h1>
    <span class="pill" id="ver">…</span>
    <span class="pill" id="mode">…</span>
    <a href="api/log?n=1000" target="_blank" rel="noopener">журнал событий</a>
    <span class="muted" id="conn"></span>
  </div>
  <div class="sysbar" id="sysbar"></div>
  <div class="layout">
    <div class="list" id="list"></div>
    <div class="detail" id="detail"><div class="card empty">Нет активных каналов. Включите канал в плеере — он появится здесь.</div></div>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const LV = { good: ["✓", "lv-good"], warning: ["!", "lv-warning"], serious: ["!", "lv-serious"], critical: ["×", "lv-critical"], info: ["i", "lv-info"] };
const EK = { info: "info", warn: "warning", crit: "critical", tune: "good", mark: "serious" };
const MODES = { auto: "режим: авто-подстройка", advise: "режим: только советы", off: "режим: фиксированные параметры" };
let state = { sel: null, status: null, detail: null, busy: false, view: "live", sessFile: null, sessions: [], sessAt: 0 };

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v; else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) el.append(k);
  return el;
}
function s(tag, attrs = {}) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}
function statusBadge(level, label) {
  const [ic, cls] = LV[level] || LV.info;
  return h("span", { class: "status " + cls }, h("i", { text: ic, "aria-hidden": "true" }), h("span", { text: label }));
}
const fmt = (v, d = 0) => (v == null || isNaN(v)) ? "—" : Number(v).toLocaleString("ru-RU", { maximumFractionDigits: d, minimumFractionDigits: d });
function clock(t) { // t: seconds since channel T0
  const d = state.detail; if (!d) return "";
  const ms = (d.t0_unix + t) * 1000;
  return new Date(ms).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
function css(v) { return getComputedStyle($(".viz-root")).getPropertyValue(v).trim(); }

// ---------- tooltip
const tip = $("#tip");
function showTip(ev, head, rows) {
  tip.replaceChildren(h("div", { class: "hd", text: head }));
  for (const r of rows) {
    const key = r.color ? h("span", { class: "key-line", style: "background:" + r.color }) : null;
    tip.append(h("div", { class: "row" }, h("span", { class: "sec" }, key, " ", r.name), h("b", { text: r.value })));
  }
  tip.style.display = "block";
  const x = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
  const y = Math.min(ev.clientY + 14, window.innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip(ev) {
  if (ev && ev.pointerType && ev.pointerType !== "mouse") return; // touch: keep until next tap
  tip.style.display = "none";
}
// touch: a tap shows the same tooltip as hover
document.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse") return;
  if (!e.target.closest("svg") && !e.target.closest(".strip")) { tip.style.display = "none"; return; }
  e.target.dispatchEvent(new PointerEvent("pointermove", { clientX: e.clientX, clientY: e.clientY, pointerType: e.pointerType }));
});

// ---------- scales & axes
function niceMax(v) {
  if (!(v > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}
function frame(el, height, yMax, yUnit) {
  const W = Math.max(280, el.clientWidth || 600), H = window.innerWidth < 700 ? Math.round(height * 0.8) : height;
  const m = { l: 40, r: 12, t: 8, b: 22 };
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" });
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const y = v => m.t + ih - (v / yMax) * ih;
  for (let i = 0; i <= 4; i++) {
    const v = yMax * i / 4, yy = y(v);
    svg.append(s("line", { x1: m.l, x2: W - m.r, y1: yy, y2: yy, stroke: i ? css("--grid") : css("--axis"), "stroke-width": 1 }));
    const t = s("text", { x: m.l - 6, y: yy + 4, "text-anchor": "end", "font-size": 11, fill: css("--text-muted") });
    t.textContent = fmt(v, v < 10 && yMax <= 5 ? 1 : 0) + (i === 4 && yUnit ? " " + yUnit : "");
    svg.append(t);
  }
  return { svg, W, H, m, iw, ih, y };
}
function xTicks(f, x0, x1, x) {
  const n = Math.max(2, Math.floor(f.iw / 110));
  for (let i = 0; i <= n; i++) {
    const t = x0 + (x1 - x0) * i / n;
    const tx = s("text", { x: x(t), y: f.H - 6, "text-anchor": i === 0 ? "start" : i === n ? "end" : "middle", "font-size": 11, fill: css("--text-muted") });
    tx.textContent = clock(t);
    f.svg.append(tx);
  }
}
function refLine(f, yv, label, color) {
  const yy = f.y(yv);
  f.svg.append(s("line", { x1: f.m.l, x2: f.W - f.m.r, y1: yy, y2: yy, stroke: color, "stroke-width": 1 }));
  const t = s("text", { x: f.W - f.m.r - 2, y: yy - 4, "text-anchor": "end", "font-size": 11, fill: css("--text-secondary") });
  t.textContent = label; f.svg.append(t);
}

// ---------- line chart: reserve vs need (+ state bands)
function reserveChart(el, d) {
  const sm = d.samples;
  el.replaceChildren();
  if (sm.length < 2) { el.append(h("div", { class: "muted", text: "Данные появятся через пару секунд" })); return; }
  const x0 = sm[0].t, x1 = sm[sm.length - 1].t;
  const yMax = niceMax(Math.max(...sm.map(p => Math.max(p.ahead, p.need, p.prot))) * 1.08);
  const f = frame(el, 220, yMax, "с");
  const x = t => f.m.l + (t - x0) / Math.max(1, x1 - x0) * f.iw;
  // bands: hold > freeze > stall
  const band = (key, fill) => {
    let st = null;
    for (let i = 0; i <= sm.length; i++) {
      const on = i < sm.length && sm[i][key];
      if (on && st === null) st = sm[i].t;
      if (!on && st !== null) {
        const e = sm[Math.min(i, sm.length - 1)].t;
        f.svg.append(s("rect", { x: x(st), y: f.m.t, width: Math.max(2, x(e) - x(st)), height: f.ih, fill }));
        st = null;
      }
    }
  };
  band("stall", css("--wash-warning"));
  band("freeze", css("--wash-critical"));
  band("hold", css("--wash-hold"));
  const series = [
    { key: "prot", name: "Защита (край + буфер плеера)", color: css("--series-3") },
    { key: "ahead", name: "Скачанный запас впереди", color: css("--series-1") },
    { key: "need", name: "Нужно, чтобы не было фризов", color: css("--series-2") },
  ];
  for (const sr of series) {
    const dpath = sm.map((p, i) => (i ? "L" : "M") + x(p.t).toFixed(1) + " " + f.y(Math.min(p[sr.key], yMax)).toFixed(1)).join(" ");
    f.svg.append(s("path", { d: dpath, fill: "none", stroke: sr.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    const last = sm[sm.length - 1];
    f.svg.append(s("circle", { cx: x(last.t), cy: f.y(Math.min(last[sr.key], yMax)), r: 4, fill: sr.color, stroke: css("--surface-1"), "stroke-width": 2 }));
  }
  for (const mk of d.marks || []) {
    if (mk.t < x0 || mk.t > x1) continue;
    f.svg.append(s("line", { x1: x(mk.t), x2: x(mk.t), y1: f.m.t, y2: f.m.t + f.ih, stroke: css("--text-primary"), "stroke-width": 1 }));
    const lt = s("text", { x: x(mk.t) + 4, y: f.m.t + 12, "font-size": 11, fill: css("--text-primary") });
    lt.textContent = "фриз " + mk.at; f.svg.append(lt);
  }
  xTicks(f, x0, x1, x);
  // crosshair
  const cross = s("line", { y1: f.m.t, y2: f.m.t + f.ih, stroke: css("--axis"), "stroke-width": 1, visibility: "hidden" });
  f.svg.append(cross);
  const hit = s("rect", { x: f.m.l, y: f.m.t, width: f.iw, height: f.ih, fill: "transparent" });
  hit.addEventListener("pointermove", ev => {
    const r = f.svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) * f.W / r.width;
    const t = x0 + (px - f.m.l) / f.iw * (x1 - x0);
    let best = sm[0]; for (const p of sm) if (Math.abs(p.t - t) < Math.abs(best.t - t)) best = p;
    cross.setAttribute("x1", x(best.t)); cross.setAttribute("x2", x(best.t)); cross.setAttribute("visibility", "visible");
    const rows = series.map(sr => ({ name: sr.name, value: fmt(best[sr.key], 1) + " с", color: sr.color }));
    rows.push({ name: "Буфер плеера (оценка)", value: fmt(best.client, 1) + " с" });
    const st = best.hold ? "пауза-добор" : best.freeze ? "фриз у плеера" : best.stall ? "край ждёт сегмент" : null;
    if (st) rows.push({ name: "Состояние", value: st });
    showTip(ev, clock(best.t), rows);
  });
  hit.addEventListener("pointerleave", ev => { if (ev.pointerType === "mouse") { cross.setAttribute("visibility", "hidden"); hideTip(); } });
  f.svg.append(hit);
  const lg = h("div", { class: "legend" });
  for (const sr of series) lg.append(h("span", {}, h("span", { class: "key-line", style: "background:" + sr.color }), sr.name));
  lg.append(h("span", {}, h("span", { class: "key-rect", style: "background:" + css("--wash-warning") }), "край ждёт"),
            h("span", {}, h("span", { class: "key-rect", style: "background:" + css("--wash-critical") }), "фриз у плеера (оценка)"),
            h("span", {}, h("span", { class: "key-rect", style: "background:" + css("--wash-hold") }), "пауза-добор"));
  el.append(lg, f.svg);
}

// ---------- columns: lateness per segment vs protection
function latenessChart(el, d) {
  el.replaceChildren();
  const recs = d.segments.filter(r => !r.init).slice(-150);
  const live = recs.filter(r => !r.failed);
  if (live.length < 2) { el.append(h("div", { class: "muted", text: "Нужно несколько сегментов эфира" })); return; }
  const qmin = Math.min(...live.map(r => r.q));
  const have = d.diag.have_s;
  const yMax = niceMax(Math.max(have, ...live.map(r => r.q - qmin)) * 1.1);
  const f = frame(el, 200, yMax, "с");
  const n = recs.length, slot = f.iw / n, bw = Math.max(1, Math.min(24, slot - 2));
  recs.forEach((r, i) => {
    const cx = f.m.l + slot * i + slot / 2;
    let el2;
    if (r.failed) {
      el2 = s("rect", { x: cx - bw / 2, y: f.m.t, width: bw, height: f.ih, fill: css("--wash-critical") });
    } else {
      const v = r.q - qmin, over = v > have;
      const top = f.y(Math.min(v, yMax)), hgt = Math.max(1, f.m.t + f.ih - top);
      const rr = Math.min(4, bw / 2, hgt);
      const x0 = cx - bw / 2, x1 = cx + bw / 2, yb = f.m.t + f.ih;
      el2 = s("path", { d: `M${x0} ${yb} V${top + rr} Q${x0} ${top} ${x0 + rr} ${top} H${x1 - rr} Q${x1} ${top} ${x1} ${top + rr} V${yb} Z`, fill: over ? css("--critical") : r.bad ? css("--serious") : css("--series-1") });
    }
    const hit = s("rect", { x: cx - slot / 2, y: f.m.t, width: slot, height: f.ih, fill: "transparent" });
    hit.addEventListener("pointermove", ev => {
      const rows = r.failed ? [{ name: "Сегмент", value: r.gap ? "потерян у провайдера" : "не скачался" }]
        : [{ name: "Опоздание", value: fmt(r.q - qmin, 1) + " с" }, { name: "Скорость", value: "×" + fmt(r.x, 2) },
           { name: "Ожидание старта", value: fmt(r.wait, 1) + " с" }, { name: "Битрейт", value: fmt(r.mbps, 1) + " Мбит/с" },
           { name: "Попыток", value: String(r.tries) }];
      if (r.bad) rows.push({ name: "Дефект потока", value: [r.cc ? "потеряно пакетов " + r.cc : "", r.ts_gap ? "дыра " + fmt(r.ts_gap, 2) + " с" : "", r.ts_short ? "короче на " + fmt(r.ts_short, 2) + " с" : "", r.ts_jump ? "скачок " + fmt(r.ts_jump, 2) + " с" : ""].filter(Boolean).join(", ") });
      showTip(ev, clock(r.t) + (r.id >= 0 ? " · сегм. " + r.id : ""), rows);
    });
    hit.addEventListener("pointerleave", hideTip);
    f.svg.append(el2, hit);
  });
  refLine(f, Math.min(have, yMax), "защита " + fmt(have) + " с", css("--text-secondary"));
  const lg = h("div", { class: "legend" },
    h("span", {}, h("span", { class: "key-rect", style: "background:" + css("--series-1") }), "опоздание сегмента (укладывается в защиту)"),
    h("span", {}, statusBadge("critical", "превысило защиту → фриз")),
    h("span", {}, statusBadge("serious", "дефект в потоке провайдера")),
    h("span", {}, h("span", { class: "key-rect", style: "background:" + css("--wash-critical") }), "сегмент потерян"));
  el.append(lg, f.svg);
}

// ---------- speed: provider -> router and router -> TV, × realtime
function speedChart(el, d) {
  el.replaceChildren();
  const prov = d.segments.filter(r => !r.failed && r.x > 0).slice(-150);
  const lan = (d.client || []).filter(r => !r.aborted && r.x > 0 && r.kb >= 64).slice(-150);
  const abr = (d.client || []).filter(r => r.aborted).slice(-50);
  if (prov.length < 2) { el.append(h("div", { class: "muted", text: "Нужно несколько сегментов" })); return; }
  const all = prov.concat(lan);
  const x0 = Math.min(...all.map(r => r.t)), x1 = Math.max(...all.map(r => r.t));
  const yMax = niceMax(Math.max(2, ...all.map(r => Math.min(r.x, 20))) * 1.05);
  const f = frame(el, 200, yMax, "×");
  const x = t => f.m.l + (t - x0) / Math.max(1, x1 - x0) * f.iw;
  const y1 = f.y(1);
  f.svg.append(s("line", { x1: f.m.l, x2: f.W - f.m.r, y1: y1, y2: y1, stroke: css("--critical"), "stroke-width": 1 }));
  const series = [
    { name: "провайдер → роутер", color: css("--series-1"), pts: prov, tip: r => [{ name: "Размер", value: fmt(r.kb / 1024, 1) + " МБ" }, { name: "Попыток", value: String(r.tries) }] },
    { name: "роутер → ТВ", color: css("--series-2"), pts: lan, tip: r => [{ name: "Скорость", value: fmt(r.mbps) + " Мбит/с" }, { name: "Отдача", value: fmt(r.sec, 1) + " с" }] },
  ];
  for (const sr of series) for (const r of sr.pts) {
    const cy = f.y(Math.min(r.x, yMax));
    const dot = s("circle", { cx: x(r.t), cy, r: 4, fill: sr.color, stroke: css("--surface-1"), "stroke-width": 2 });
    const hit = s("circle", { cx: x(r.t), cy, r: 12, fill: "transparent" });
    hit.addEventListener("pointermove", ev => showTip(ev, clock(r.t) + " · сегм. " + r.id, [{ name: sr.name, value: "×" + fmt(r.x, 2), color: sr.color }, ...sr.tip(r)]));
    hit.addEventListener("pointerleave", hideTip);
    f.svg.append(dot, hit);
  }
  for (const r of abr) {
    const xx = x(Math.min(Math.max(r.t, x0), x1));
    f.svg.append(s("line", { x1: xx, x2: xx, y1: f.m.t + f.ih - 10, y2: f.m.t + f.ih, stroke: css("--critical"), "stroke-width": 2 }));
  }
  xTicks(f, x0, x1, x);
  const lg = h("div", { class: "legend" });
  for (const sr of series) lg.append(h("span", {}, h("span", { class: "key-rect", style: "border-radius:50%;background:" + sr.color }), sr.name));
  lg.append(h("span", {}, h("span", { class: "key-line", style: "background:" + css("--critical") }), "×1: передача заняла всю длительность сегмента"));
  if (abr.length) lg.append(h("span", {}, statusBadge("critical", "плеер оборвал загрузку")));
  el.append(lg, f.svg);
}

// ---------- protection meter
function meter(el, d) {
  el.replaceChildren();
  const g = d.diag;
  const top = niceMax(Math.max(g.need_s * 1.25 + d.seg_dur_s, g.have_s, g.avail_s + d.seg_dur_s * 3, 10) * 1.05);
  const W = Math.max(300, el.clientWidth || 600), H = 64, l = 0, r = 0, iw = W - l - r;
  const x = v => l + Math.min(v, top) / top * iw;
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" });
  const ok = g.have_s >= g.need_s * 1.25 || g.verdict === "ok";
  const fill = g.verdict === "learning" ? css("--series-1") : ok ? css("--good") : (g.level === "critical" ? css("--critical") : css("--warning"));
  svg.append(s("rect", { x: l, y: 22, width: iw, height: 12, rx: 4, fill: css("--surface-2") }));
  svg.append(s("rect", { x: l, y: 22, width: Math.max(4, x(g.have_s) - l), height: 12, rx: 4, fill }));
  const mark = (v, label, color, up) => {
    const xx = x(v);
    svg.append(s("line", { x1: xx, x2: xx, y1: up ? 14 : 22, y2: up ? 34 : 42, stroke: color, "stroke-width": 2 }));
    const t = s("text", { x: Math.min(Math.max(xx, 30), W - 30), y: up ? 10 : 56, "text-anchor": "middle", "font-size": 11, fill: css("--text-secondary") });
    t.textContent = label; svg.append(t);
  };
  if (g.verdict !== "learning") mark(g.need_s, "нужно " + fmt(g.need_s) + " с", css("--text-primary"), true);
  mark(g.avail_s + d.seg_dur_s * 3, "окно провайдера ≈" + fmt(g.avail_s + d.seg_dur_s * 3) + " с", css("--text-muted"), false);
  if (g.max_s < top) mark(g.max_s, "max_delay " + fmt(g.max_s) + " с", css("--text-muted"), false);
  el.append(svg);
}

// ---------- quality
const LVCOLOR = { good: "--good", warning: "--warning", serious: "--serious", critical: "--critical", info: "--text-muted" };
function gradScale(score, level) {
  // 5 grade bands: <35 очень плохо · 35 плохо · 55 удовл. · 75 хорошо · 90 отлично
  const wrap = h("div");
  const sc = h("div", { class: "scale", role: "img", "aria-label": "оценка " + score + " из 100" });
  sc.append(h("div", { class: "fill", style: `width:${Math.max(2, score)}%;background:var(${LVCOLOR[level] || "--text-muted"})` }));
  for (const t of [35, 55, 75, 90]) sc.append(h("div", { class: "tick", style: `left:${t}%` }));
  const lb = h("div", { class: "scalelabels" });
  for (const [t, n] of [[17, "оч. плохо"], [45, "плохо"], [65, "удовл."], [82, "хорошо"], [95, "отлично"]]) lb.append(h("span", { style: `left:${t}%`, text: n }));
  wrap.append(sc, lb);
  return wrap;
}

function qualityCard(d) {
  const q = d.quality || {};
  const card = h("div", { class: "card" });
  const learning = q.learning;
  const score = h("div", { class: "qscore" },
    h("div", { class: "num", text: learning ? "…" : String(q.score) }),
    h("div", { class: "of", text: learning ? "сбор данных" : "из 100" }),
    statusBadge(q.level || "info", "Поток: " + (q.grade || "—")));
  const rows = h("div");
  const row = (name, val, grade, level, note) => rows.append(h("div", { class: "qrow" },
    h("div", { class: "lb", text: name }), gradScale(val, level), h("div", { class: "vl" }, statusBadge(level, `${val} · ${grade}`), note ? h("div", { class: "muted", style: "font-size:11px", text: note }) : null)));
  row("Картинка", q.picture, q.pic_grade, q.pic_level, q.tier ? q.tier + (q.bitrate_note ? ", битрейт " + q.bitrate_note : "") : "");
  row("Стабильность", learning ? 0 : q.stability, q.stab_grade, q.stab_level, "за последние 30 мин");
  card.append(h("div", { class: "qhero" }, score, rows));
  const v = q.video;
  const chips = h("div", { class: "chips" });
  if (v) {
    if (q.tier) chips.append(h("span", { class: "tierbadge", text: q.tier }));
    chips.append(h("span", { class: "chip" }, h("b", { text: v.codec }), v.profile ? " " + v.profile : ""));
    if (v.width) chips.append(h("span", { class: "chip" }, h("b", { text: `${v.width}×${v.height}${v.interlaced ? "i" : "p"}` }), v.fps ? ` · ${fmt(v.fps, v.fps % 1 ? 2 : 0)} к/с` : ""));
    if (v.bit_depth) chips.append(h("span", { class: "chip", text: v.bit_depth + " бит" }));
    if (v.audio || v.tracks) chips.append(h("span", { class: "chip", text: "звук " + (v.audio || "?") + (v.tracks > 1 ? ` · дорожек ${v.tracks}` : "") }));
  }
  if (q.bitrate_mbps) chips.append(h("span", { class: "chip" }, h("b", { text: fmt(q.bitrate_mbps, 1) + " Мбит/с" }), q.peak_mbps ? ` · пик ${fmt(q.peak_mbps, 1)}` : ""));
  if (d.prov_window_s) chips.append(h("span", { class: "chip", text: `окно провайдера ${fmt(d.prov_window_s)} с` }));
  card.append(chips);
  const fs = [...(q.pic_factors || []), ...(q.stab_factors || [])].filter(f => f.penalty > 0 || !learning);
  if (fs.length) {
    const ul = h("ul", { class: "factors" });
    for (const f of fs) ul.append(h("li", { text: (f.penalty ? `−${f.penalty}: ` : "") + f.text }));
    card.append(h("div", { class: "sec", style: "font-size:12px;margin-top:10px", text: "Что снижает оценку" }), ul);
  } else if (!learning) {
    card.append(h("div", { class: "muted", style: "font-size:12px;margin-top:10px", text: "Ничего не снижает оценку за последние 30 минут." }));
  }
  // per-segment strip
  const recs = d.segments.filter(r => !r.init).slice(window.innerWidth < 700 ? -60 : -120);
  if (recs.length > 3) {
    const lanBy = {}; for (const r of d.client || []) lanBy[r.id] = r;
    const live = recs.filter(r => !r.failed);
    const qmin = live.length ? Math.min(...live.map(r => r.q)) : 0;
    const have = d.diag.have_s;
    const strip = h("div", { class: "strip", role: "img", "aria-label": "качество последних сегментов" });
    let nb = 0, nw = 0;
    for (const r of recs) {
      const ln = lanBy[r.id];
      let lv = "good", why = "норма";
      if (r.failed) { lv = "critical"; why = r.gap ? "потерян у провайдера" : "не скачан"; }
      else if (r.bad) { lv = "critical"; why = "дефект потока"; }
      else if (r.q - qmin > have) { lv = "critical"; why = "опоздал больше защиты"; }
      else if (ln && ln.aborted) { lv = "serious"; why = "плеер оборвал загрузку"; }
      else if ((ln && ln.x > 0 && ln.x < 1.5) || r.x < 1.2 || r.tries > 1 || r.q - qmin > have * 0.7) {
        lv = "warning"; why = r.tries > 1 ? "со 2-й попытки" : r.x < 1.2 ? "медленно от провайдера" : (ln && ln.x < 1.5) ? "медленно до ТВ" : "почти исчерпал запас";
      }
      if (lv === "critical" || lv === "serious") nb++; else if (lv === "warning") nw++;
      const cell = h("i", { style: `background:var(${LVCOLOR[lv]})` });
      cell.addEventListener("pointermove", ev => showTip(ev, clock(r.t) + (r.id >= 0 ? " · сегм. " + r.id : ""), [
        { name: "Оценка", value: why }, { name: "× провайдер", value: r.failed ? "—" : "×" + fmt(r.x, 1) },
        { name: "× до ТВ", value: ln && ln.x ? "×" + fmt(ln.x, 1) : "—" }, { name: "Опоздание", value: r.failed ? "—" : fmt(r.q - qmin, 1) + " с" }]));
      cell.addEventListener("pointerleave", hideTip);
      strip.append(cell);
    }
    card.append(h("div", { class: "sec", style: "font-size:12px;margin-top:12px", text: `Последние ${recs.length} сегментов: проблемных ${nb}, на грани ${nw}` }), strip,
      h("div", { class: "legend", style: "margin-top:6px" },
        h("span", {}, statusBadge("good", "норма")), h("span", {}, statusBadge("warning", "на грани")),
        h("span", {}, statusBadge("serious", "обрыв у плеера")), h("span", {}, statusBadge("critical", "фриз/дефект/потеря"))));
  }
  return card;
}

function viewersCard(d) {
  const vs = d.viewers || [];
  const card = h("div", { class: "card" }, h("h2", { text: "Зрители и трафик" }));
  if (!vs.length) card.append(h("div", { class: "muted", text: "Нет данных о зрителях" }));
  for (const v of vs) {
    card.append(h("div", { class: "viewer" },
      h("span", { class: "dot", title: v.active ? "смотрит" : "не активен", style: `background:var(${v.active ? "--good" : "--text-muted"})` }),
      h("div", {}, h("div", {}, h("b", { text: v.external ? "Извне " : "Дома " }), h("span", { class: "sec", text: v.ip })),
        h("div", { class: "muted", style: "font-size:11px;word-break:break-all", text: v.ua })),
      h("div", { class: "sec", style: "text-align:right;font-size:12px", text: `${fmt(v.mb)} МБ · ${fmt(v.minutes)} мин` })));
  }
  card.append(h("div", { class: "muted", style: "font-size:12px;margin-top:8px", text:
    `От провайдера ${fmt(d.upstream_mb)} МБ, отдано на ТВ ${fmt(d.served_mb)} МБ` + (d.served_mb > d.upstream_mb * 1.2 ? " (несколько зрителей на один канал — скачано один раз)" : "") }));
  return card;
}

function renderSys(st) {
  const sy = st.system || {}, bar = $("#sysbar");
  bar.replaceChildren();
  if (!sy.mem_total_mb) return;
  const memLv = sy.mem_avail_mb < 80 ? "critical" : sy.mem_avail_mb < 200 ? "warning" : "good";
  const tmpLv = sy.tmp_total_mb && sy.tmp_used_mb / sy.tmp_total_mb > 0.85 ? "critical" : "good";
  const ldLv = sy.load1 > sy.cpus * 1.5 ? "warning" : "good";
  bar.append(
    h("span", { class: "pill" }, statusBadge(memLv, `RAM свободно ${fmt(sy.mem_avail_mb)} из ${fmt(sy.mem_total_mb)} МБ`)),
    h("span", { class: "pill" }, statusBadge(tmpLv, `кэш ${fmt(sy.cache_mb)} МБ · tmpfs ${fmt(sy.tmp_used_mb)}/${fmt(sy.tmp_total_mb)} МБ`)),
    h("span", { class: "pill" }, statusBadge(ldLv, `нагрузка ${fmt(sy.load1, 2)} (${sy.cpus} ядер) · прокси ${fmt(sy.proxy_rss_mb)} МБ`)),
    h("span", { class: "pill", text: `каналов ${sy.channels} · зрителей ${sy.viewers}${sy.external_viewers ? " (извне " + sy.external_viewers + ")" : ""}` }),
    h("span", { class: "pill", text: `трафик: провайдер ${fmt(sy.upstream_gb, 2)} ГБ → ТВ ${fmt(sy.served_gb, 2)} ГБ` }));
}

// ---------- render
function tile(lb, vl, sub) { return h("div", { class: "card tile" }, h("div", { class: "lb", text: lb }), h("div", { class: "vl", text: vl }), sub ? h("div", { class: "sub", text: sub }) : null); }

function renderList() {
  const st = state.status, list = $("#list");
  list.replaceChildren(h("div", { class: "side-h" }, h("span", { text: "Сейчас смотрят" })));
  if (!st || !st.channels.length) list.append(h("div", { class: "card muted", text: "Активных каналов нет" }));
  else {
    if (state.view === "live" && (!state.sel || !st.channels.find(c => c.id === state.sel))) state.sel = st.channels[0].id;
    for (const c of st.channels) {
      list.append(h("button", { class: "card ch", "aria-current": String(state.view === "live" && c.id === state.sel),
        onclick: () => { state.view = "live"; state.sel = c.id; state.detail = null; renderList(); refresh(); } },
        h("div", { class: "nm", text: c.name, title: c.source }),
        h("div", { style: "display:flex;gap:8px;align-items:center;margin:2px 0" },
          c.quality && c.quality.tier ? h("span", { class: "tierbadge", text: c.quality.tier }) : null,
          statusBadge(c.quality ? c.quality.level : "info", c.quality && !c.quality.learning ? `${c.quality.score} · ${c.quality.grade}` : "оценивается…")),
        h("div", { class: "muted", style: "font-size:12px", text: c.diag.title }),
        h("div", { class: "muted", style: "font-size:12px;margin-top:2px", text:
          `защита ${fmt(c.diag.have_s)} с · нужно ${fmt(c.diag.need_s)} с · фризов ${c.stats.Freezes}` + (c.idle_s > 15 ? " · не смотрят" : "") })));
    }
  }
  list.append(h("div", { class: "side-h" }, h("span", { text: "История сеансов" }), h("span", { class: "muted", text: state.sessions.length ? String(state.sessions.length) : "" })));
  if (!state.sessions.length) list.append(h("div", { class: "card muted", style: "font-size:12px", text: "Сохраняются при остановке канала и каждые 5 мин" }));
  for (const m of state.sessions.slice(0, 40)) {
    const lv = m.marks ? "serious" : m.level || "info";
    list.append(h("button", { class: "card sess", "aria-current": String(state.view === "session" && state.sessFile === m.file),
      onclick: () => openSession(m.file) },
      h("div", { class: "nm", text: m.name }),
      h("div", { class: "muted", style: "font-size:12px", text: `${m.start} – ${m.end.slice(11)}${m.live ? " (идёт)" : ""} · ${fmt(m.minutes)} мин` }),
      h("div", { style: "font-size:12px;margin-top:2px" }, statusBadge(m.qlevel || lv, (m.grade && !m.grade.startsWith("оцен") ? `${m.score} · ${m.grade} · ` : "") + `фризов ${m.freezes} · отметок ${m.marks}`)),
      m.picture ? h("div", { class: "muted", style: "font-size:11px", text: m.picture }) : null));
  }
}

async function openSession(file) {
  state.view = "session"; state.sessFile = file; renderList();
  $("#detail").classList.add("stale");
  const r = await fetch("api/sessions/" + encodeURIComponent(file), { cache: "no-store" });
  if (r.ok) { state.detail = await r.json(); state.detail.__file = file; renderDetail(); }
}

async function sendMark(ago, out) {
  const d = state.detail;
  out.replaceChildren(h("span", { class: "muted", text: "Разбираю…" }));
  try {
    const r = await fetch("api/channel/" + d.id + "/mark", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ago }) });
    const m = await r.json();
    out.replaceChildren(markView(m));
  } catch (e) { out.replaceChildren(h("span", { text: "Ошибка: " + e })); }
}

function markView(m) {
  const ul = h("ul", { class: "reasons" }); for (const c of m.causes || []) ul.append(h("li", { text: c }));
  return h("div", { class: "mk" }, h("div", {}, h("span", { class: "muted", text: m.at + "  " }), statusBadge(m.level, m.summary)), ul);
}

function renderDetail() {
  const d = state.detail, root = $("#detail");
  if (!d) return;
  const live = state.view === "live";
  const g = d.diag, [ic, cls] = LV[g.level] || LV.info;
  root.classList.remove("stale");
  root.replaceChildren();

  root.append(qualityCard(d));
  if (!live) {
    root.append(h("div", { class: "banner" }, "Сохранённый сеанс: ", h("b", { text: d.name }), ` · начало ${new Date(d.t0_unix * 1000).toLocaleString("ru-RU")}` +
      (d.live ? " · канал ещё идёт, снимок раз в 5 мин" : "") + " · ",
      h("a", { href: "api/sessions/" + encodeURIComponent(d.__file) + "?download=1", text: "скачать JSON" })));
  } else {
    const out = h("div", { class: "marks" });
    root.append(h("div", { class: "card" },
      h("h2", { text: "Был фриз? Отметьте — прокси разберёт, что происходило в этот момент" }),
      h("div", { class: "btnrow" },
        ...[["только что", 3], ["15 с назад", 15], ["30 с назад", 30], ["1 мин назад", 60]].map(([t, ago]) =>
          h("button", { class: "btn" + (ago === 3 ? " primary" : ""), text: t, onclick: () => sendMark(ago, out) }))), out));
  }

  // verdict
  const v = h("div", { class: "card" },
    h("div", { class: "muted", text: d.name + " · " + d.source }),
    h("div", { class: "verdict-title status " + cls }, h("i", { text: ic, "aria-hidden": "true" }), h("span", { text: g.title })));
  const ul = h("ul", { class: "reasons" }); for (const r of g.reasons || []) ul.append(h("li", { text: r })); v.append(ul);
  const m = h("div", { class: "meter" }); v.append(h("div", { style: "margin-top:10px" }, h("div", { class: "sec", style: "font-size:12px", text: "Защита от провалов провайдера, секунд" }), m));
  if (live && g.verdict !== "learning") {
    const inD = h("input", { class: "num", type: "number", min: "0", max: String(g.max_s), value: String(Math.max(g.rec_delay, 0)) });
    const inC = h("input", { class: "num", type: "number", min: "1", max: "6", value: String(g.rec_conc) });
    const msg = h("span", { class: "muted" });
    const apply = h("button", { class: "btn primary", text: "Применить для канала", onclick: async () => {
      apply.disabled = true;
      try {
        const r = await fetch("api/channel/" + d.id + "/apply", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ delay: Number(inD.value), concurrency: Number(inC.value) }) });
        msg.textContent = r.ok ? "Сохранено в профиль канала. delay сработает при следующем включении канала." : "Ошибка " + r.status;
      } catch (e) { msg.textContent = "Ошибка: " + e; }
      apply.disabled = false;
    }});
    const forget = h("button", { class: "btn", text: "Сбросить профиль", onclick: async () => {
      await fetch("api/channel/" + d.id + "/forget", { method: "POST" }); msg.textContent = "Профиль удалён";
    }});
    v.append(h("div", { class: "rec" },
      h("span", {}, h("b", { text: "Рекомендовано: " }), "delay "), inD, h("span", { text: "с, потоков" }), inC,
      g.rec_ram_mb ? h("span", { class: "muted", text: "· RAM ≈ " + g.rec_ram_mb + " МБ" }) : null, apply, forget, msg));
    const pr = d.profile;
    v.append(h("div", { class: "muted", style: "font-size:12px;margin-top:8px", text:
      "Сейчас у канала: delay " + fmt(d.delay_param_s) + " с, потоков " + d.concurrency +
      (pr ? ` · профиль: delay ${pr.delay} с, потоков ${pr.concurrency}${pr.manual ? " (задан вручную)" : ""}, сеансов ${pr.sessions}, обновлён ${pr.updated}` : " · профиля пока нет") }));
  }
  root.append(v);
  meter(m, d);

  // other causes
  if ((g.other || []).length) {
    const oc = h("div", { class: "card" }, h("h2", { text: "Другие причины фризов (не связанные с запасом)" }));
    for (const c of g.other) oc.append(h("div", { style: "margin:6px 0" }, statusBadge(c.level, c.text)));
    root.append(oc);
  }
  // marks
  if ((d.marks || []).length) {
    const mc = h("div", { class: "card marks" }, h("h2", { text: "Отметки фризов" }));
    for (const mk of [...d.marks].reverse()) mc.append(markView(mk));
    root.append(mc);
  }

  root.append(viewersCard(d));
  // tiles
  const sx = d.stats;
  root.append(h("div", { class: "tiles" },
    tile("Отставание плеера от эфира", "≈" + fmt(d.delay_s + d.client_buf_s) + " с", "в RAM роутера " + fmt(d.delay_s) + " с, у плеера ≈" + fmt(d.client_buf_s) + " с"),
    tile("Скачанный запас", fmt(d.ready_ahead_s) + " с", d.holding ? "идёт пауза-добор" : d.stall ? "край ждёт сегмент" : "впереди края плеера"),
    tile("Буфер плеера (оценка)", fmt(d.client_buf_s) + " с", d.idle_s > 15 ? "плеер не запрашивает" : d.client_playing ? "играет" : "буферизация"),
    tile("Ёмкость канала", g.cap_x < 0 ? "с запасом" : "×" + fmt(g.cap_x, 2), "загрузчик занят " + fmt(g.busy_pct) + "% времени"),
    tile("Доставка до ТВ", g.lan_mbps ? fmt(g.lan_mbps) + " Мбит/с" : "—", g.lan_min_x > 0 ? "худший сегмент ×" + fmt(g.lan_min_x, 1) : "нет данных"),
    tile("Битрейт потока", fmt(g.bitrate_mbps, 1) + " Мбит/с", "сегмент " + fmt(d.seg_dur_s, 1) + " с, потоков " + d.concurrency),
    tile("Дефекты потока", String(sx.Defects), "CC/дыры/скачки, за 10 мин: " + g.defects),
    tile("Фризов у плеера", String(sx.Freezes), "оценка, всего " + fmt(sx.FreezeS) + " с"),
    tile("Пауз-добора", String(sx.Holds), fmt(sx.HoldS) + " с суммарно"),
    tile("Потеряно сегментов", String(sx.Skipped + sx.Gaps), "ретраев " + sx.Retries),
    tile("Плеер", String(sx.ClAborted + sx.ClientRest), `обрывов ${sx.ClAborted}, перезапусков ${sx.ClientRest}, пауз опроса ${sx.PollGaps}`)));

  const c1 = h("div", { class: "chart" }), c2 = h("div", { class: "chart" }), c3 = h("div", { class: "chart" });
  root.append(h("div", { class: "card" }, h("h2", { text: "Запас и потребность" }), c1));
  root.append(h("div", { class: "grid2" },
    h("div", { class: "card" }, h("h2", { text: "Опоздание сегментов относительно лучшего случая" }), c2),
    h("div", { class: "card" }, h("h2", { text: "Скорость передачи сегментов, × реального времени" }), c3)));
  reserveChart(c1, d); latenessChart(c2, d); speedChart(c3, d);

  // events
  const evs = h("div", { class: "events" });
  for (const e of [...d.events].reverse()) {
    const [ic2, cls2] = LV[EK[e.kind]] || LV.info;
    evs.append(h("div", { class: "ev" }, h("span", { class: "tm", text: e.at }),
      h("span", { class: "status " + cls2 }, h("i", { text: e.kind === "tune" ? "⚙" : e.kind === "mark" ? "⚑" : ic2, title: e.kind })), h("span", { text: e.text })));
  }
  root.append(h("div", { class: "card" }, h("h2", { text: "События" }), evs));

  // table view
  const lanBy = {}; for (const r of d.client || []) if (!r.aborted) lanBy[r.id] = r;
  const tb = h("table", { class: "data" });
  tb.append(h("tr", {}, ...["Время", "Сегм.", "Длит., с", "МБ", "Мбит/с", "× провайдер", "× до ТВ", "Опоздание, с", "Попыток", "Поток", ""].map(t => h("th", { text: t }))));
  const lv = d.segments.filter(r => !r.init && !r.failed);
  const qmin = lv.length ? Math.min(...lv.map(r => r.q)) : 0;
  for (const r of d.segments.slice(-80).reverse()) {
    const ln = lanBy[r.id];
    const defect = r.bad ? [r.cc ? "CC " + r.cc : "", r.ts_gap ? "дыра " + fmt(r.ts_gap, 2) : "", r.ts_short ? "короче " + fmt(r.ts_short, 2) : "", r.ts_jump ? "скачок " + fmt(r.ts_jump, 2) : ""].filter(Boolean).join(", ") : "ок";
    tb.append(h("tr", {}, ...[clock(r.t), r.id >= 0 ? r.id : "—", fmt(r.dur, 1), fmt(r.kb / 1024, 1), fmt(r.mbps, 1), r.failed ? "—" : fmt(r.x, 2),
      ln ? fmt(ln.x, 1) : "—", r.failed || r.init ? "—" : fmt(r.q - qmin, 1), r.tries || "—", r.failed ? "—" : defect,
      r.failed ? (r.gap ? "потерян у провайдера" : "не скачан") : r.init ? "стартовое окно" : ""].map(t => h("td", { text: String(t) }))));
  }
  root.append(h("details", { class: "card" }, h("summary", { text: "Таблица последних сегментов" }), h("div", { class: "tablewrap" }, tb)));
}

async function refresh() {
  if (state.busy) return; state.busy = true;
  try {
    const st = await (await fetch("api/status", { cache: "no-store" })).json();
    state.status = st;
    $("#ver").textContent = "v" + st.version;
    $("#mode").textContent = MODES[st.mode] || st.mode;
    $("#conn").textContent = "";
    renderSys(st);
    if (Date.now() - state.sessAt > 10000) {
      state.sessAt = Date.now();
      try { state.sessions = await (await fetch("api/sessions", { cache: "no-store" })).json(); } catch (e) {}
    }
    renderList();
    if (state.view === "live") {
      if (state.sel) {
        $("#detail").classList.add("stale");
        const r = await fetch("api/channel/" + state.sel, { cache: "no-store" });
        if (r.ok) { state.detail = await r.json(); renderDetail(); }
      } else {
        $("#detail").replaceChildren(h("div", { class: "card empty", text: "Нет активных каналов. Включите канал в плеере или откройте сеанс из истории слева." }));
      }
    }
  } catch (e) {
    $("#conn").textContent = "нет связи с прокси";
  } finally { state.busy = false; }
}
let hovering = false;
document.addEventListener("pointerover", e => { hovering = !!e.target.closest("svg") || !!e.target.closest(".marks"); });
setInterval(() => { if (!hovering) refresh(); }, 2000);
window.addEventListener("resize", () => state.detail && renderDetail());
refresh();
</script>
</body>
</html>
