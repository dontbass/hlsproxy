<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HLS Proxy — анти-фриз</title>
<style>
.viz-root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb; --surface-2: #f0efec;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-7: #6250d6;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --good-text: #006300; --info: #898781;
  --wash-warning: rgba(250,178,25,0.16); --wash-critical: rgba(208,59,59,0.14); --wash-hold: rgba(98,80,214,0.12);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19; --surface-2: #242423;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-7: #9085e9;
    --good-text: #0ca30c;
    --wash-warning: rgba(250,178,25,0.13); --wash-critical: rgba(208,59,59,0.20); --wash-hold: rgba(144,133,233,0.16);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.viz-root { background: var(--page); color: var(--text-primary); min-height: 100vh; padding: 16px; }
h1 { font-size: 18px; margin: 0; font-weight: 600; }
h2 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
.muted { color: var(--text-muted); }
.sec { color: var(--text-secondary); }
.top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.pill { border: 1px solid var(--border); border-radius: 999px; padding: 1px 10px; font-size: 12px; color: var(--text-secondary); background: var(--surface-1); }
.layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.ch { cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
.ch[aria-current="true"] { outline: 2px solid var(--series-1); outline-offset: -1px; }
.ch .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-primary); }
.status i { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700; color: #fff; flex: none; }
.lv-good i { background: var(--good); } .lv-warning i { background: var(--warning); color: #0b0b0b; }
.lv-serious i { background: var(--serious); } .lv-critical i { background: var(--critical); } .lv-info i { background: var(--info); }
.detail { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.verdict-title { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.verdict-title i { width: 24px; height: 24px; font-size: 14px; }
ul.reasons { margin: 8px 0 0; padding-left: 18px; color: var(--text-secondary); }
ul.reasons li { margin: 4px 0; }
.rec { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; }
.rec b { font-weight: 600; }
button.btn { font: inherit; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
button.btn.primary { background: var(--series-1); border-color: transparent; color: #fff; }
button.btn:disabled { opacity: .5; cursor: default; }
input.num { width: 72px; font: inherit; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-1); color: var(--text-primary); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile .lb { font-size: 12px; color: var(--text-secondary); }
.tile .vl { font-size: 22px; font-weight: 600; margin-top: 2px; }
.tile .sub { font-size: 12px; color: var(--text-muted); }
.meter { position: relative; height: 64px; margin-top: 4px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin: 2px 0 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key-line { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
.key-rect { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; min-width: 140px; }
.tip .row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tip .row b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tip .hd { color: var(--text-muted); margin-bottom: 4px; }
.events { max-height: 320px; overflow: auto; font-size: 13px; }
.ev { display: grid; grid-template-columns: 64px 18px 1fr; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--grid); }
.ev:last-child { border-bottom: 0; }
.ev .tm { color: var(--text-muted); font-variant-numeric: tabular-nums; }
table.data { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
table.data th, table.data td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--grid); }
table.data th { color: var(--text-secondary); font-weight: 500; }
details summary { cursor: pointer; color: var(--text-secondary); }
.empty { padding: 40px; text-align: center; color: var(--text-secondary); }
.stale { opacity: .55; transition: opacity .2s; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 1200px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="viz-root">
  <div class="top">
    <h1>HLS Proxy · анти-фриз</h1>
    <span class="pill" id="ver">…</span>
    <span class="pill" id="mode">…</span>
    <span class="muted" id="conn"></span>
  </div>
  <div class="layout">
    <div class="list" id="list"></div>
    <div class="detail" id="detail"><div class="card empty">Нет активных каналов. Включите канал в плеере — он появится здесь.</div></div>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const LV = { good: ["✓", "lv-good"], warning: ["!", "lv-warning"], serious: ["!", "lv-serious"], critical: ["×", "lv-critical"], info: ["i", "lv-info"] };
const MODES = { auto: "режим: авто-подстройка", advise: "режим: только советы", off: "режим: фиксированные параметры" };
let state = { sel: null, status: null, detail: null, busy: false };

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v; else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) el.append(k);
  return el;
}
function s(tag, attrs = {}) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}
function statusBadge(level, label) {
  const [ic, cls] = LV[level] || LV.info;
  return h("span", { class: "status " + cls }, h("i", { text: ic, "aria-hidden": "true" }), h("span", { text: label }));
}
const fmt = (v, d = 0) => (v == null || isNaN(v)) ? "—" : Number(v).toLocaleString("ru-RU", { maximumFractionDigits: d, minimumFractionDigits: d });
function clock(t) { // t: seconds since channel T0
  const d = state.detail; if (!d) return "";
  const ms = Date.now() - (d.now_t - t) * 1000;
  return new Date(ms).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
function css(v) { return getComputedStyle($(".viz-root")).getPropertyValue(v).trim(); }

// ---------- tooltip
const tip = $("#tip");
function showTip(ev, head, rows) {
  tip.replaceChildren(h("div", { class: "hd", text: head }));
  for (const r of rows) {
    const key = r.color ? h("span", { class: "key-line", style: "background:" + r.color }) : null;
    tip.append(h("div", { class: "row" }, h("span", { class: "sec" }, key, " ", r.name), h("b", { text: r.value })));
  }
  tip.style.display = "block";
  const x = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
  const y = Math.min(ev.clientY + 14, window.innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.style.display = "none"; }

// ---------- scales & axes
function niceMax(v) {
  if (!(v > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}
function frame(el, height, yMax, yUnit) {
  const W = Math.max(300, el.clientWidth || 600), H = height;
  const m = { l: 40, r: 12, t: 8, b: 22 };
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" });
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const y = v => m.t + ih - (v / yMax) * ih;
  for (let i = 0; i <= 4; i++) {
    const v = yMax * i / 4, yy = y(v);
    svg.append(s("line", { x1: m.l, x2: W - m.r, y1: yy, y2: yy, stroke: i ? css("--grid") : css("--axis"), "stroke-width": 1 }));
    const t = s("text", { x: m.l - 6, y: yy + 4, "text-anchor": "end", "font-size": 11, fill: css("--text-muted") });
    t.textContent = fmt(v, v < 10 && yMax <= 5 ? 1 : 0) + (i === 4 && yUnit ? " " + yUnit : "");
    svg.append(t);
  }
  return { svg, W, H, m, iw, ih, y };
}
function xTicks(f, x0, x1, x) {
  const n = Math.max(2, Math.floor(f.iw / 110));
  for (let i = 0; i <= n; i++) {
    const t = x0 + (x1 - x0) * i / n;
    const tx = s("text", { x: x(t), y: f.H - 6, "text-anchor": i === 0 ? "start" : i === n ? "end" : "middle", "font-size": 11, fill: css("--text-muted") });
    tx.textContent = clock(t);
    f.svg.append(tx);
  }
}
function refLine(f, yv, label, color) {
  const yy = f.y(yv);
  f.svg.append(s("line", { x1: f.m.l, x2: f.W - f.m.r, y1: yy, y2: yy, stroke: color, "stroke-width": 1 }));
  const t = s("text", { x: f.W - f.m.r - 2, y: yy - 4, "text-anchor": "end", "font-size": 11, fill: css("--text-secondary") });
  t.textContent = label; f.svg.append(t);
}

// ---------- line chart: reserve vs need (+ state bands)
function reserveChart(el, d) {
  const sm = d.samples;
  el.replaceChildren();
  if (sm.length < 2) { el.append(h("div", { class: "muted", text: "Данные появятся через пару секунд" })); return; }
  const x0 = sm[0].t, x1 = sm[sm.length - 1].t;
  const yMax = niceMax(Math.max(...sm.map(p => Math.max(p.ahead, p.need, p.prot))) * 1.08);
  const f = frame(el, 220, yMax, "с");
  const x = t => f.m.l + (t - x0) / Math.max(1, x1 - x0) * f.iw;
  // bands: hold > freeze > stall
  const band = (key, fill) => {
    let st = null;
    for (let i = 0; i <= sm.length; i++) {
      const on = i < sm.length && sm[i][key];
      if (on && st === null) st = sm[i].t;
      if (!on && st !== null) {
        const e = sm[Math.min(i, sm.length - 1)].t;
        f.svg.append(s("rect", { x: x(st), y: f.m.t, width: Math.max(2, x(e) - x(st)), height: f.ih, fill }));
        st = null;
      }
    }
  };
  band("stall", css("--wash-warning"));
  band("freeze", css("--wash-critical"));
  band("hold", css("--wash-hold"));
  const series = [
    { key: "prot", name: "Защита (край + буфер плеера)", color: css("--series-3") },
    { key: "ahead", name: "Скачанный запас впереди", color: css("--series-1") },
    { key: "need", name: "Нужно, чтобы не было фризов", color: css("--series-2") },
  ];
  for (const sr of series) {
    const dpath = sm.map((p, i) => (i ? "L" : "M") + x(p.t).toFixed(1) + " " + f.y(Math.min(p[sr.key], yMax)).toFixed(1)).join(" ");
    f.svg.append(s("path", { d: dpath, fill: "none", stroke: sr.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    const last = sm[sm.length - 1];
    f.svg.append(s("circle", { cx: x(last.t), cy: f.y(Math.min(last[sr.key], yMax)), r: 4, fill: sr.color, stroke: css("--surface-1"), "stroke-width": 2 }));
  }
  xTicks(f, x0, x1, x);
  // crosshair
  const cross = s("line", { y1: f.m.t, y2: f.m.t + f.ih, stroke: css("--axis"), "stroke-width": 1, visibility: "hidden" });
  f.svg.append(cross);
  const hit = s("rect", { x: f.m.l, y: f.m.t, width: f.iw, height: f.ih, fill: "transparent" });
  hit.addEventListener("pointermove", ev => {
    const r = f.svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) * f.W / r.width;
    const t = x0 + (px - f.m.l) / f.iw * (x1 - x0);
    let best = sm[0]; for (const p of sm) if (Math.abs(p.t - t) < Math.abs(best.t - t)) best = p;
    cross.setAttribute("x1", x(best.t)); cross.setAttribute("x2", x(best.t)); cross.setAttribute("visibility", "visible");
    const rows = series.map(sr => ({ name: sr.name, value: fmt(best[sr.key], 1) + " с", color: sr.color }));
    rows.push({ name: "Буфер плеера (оценка)", value: fmt(best.client, 1) + " с" });
    const st = best.hold ? "пауза-добор" : best.freeze ? "фриз у плеера" : best.stall ? "край ждёт сегмент" : null;
    if (st) rows.push({ name: "Состояние", value: st });
    showTip(ev, clock(best.t), rows);
  });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); hideTip(); });
  f.svg.append(hit);
  const lg = h("div", { class: "legend" });
  for (const sr of series) lg.append(h("span", {}, h("span", { class: "key-line", style: "background:" + sr.color }), sr.name));
  lg.append(h("span", {}, h("span", { class: "key-rect", style: "background:" + css("--wash-warning") }), "край ждёт"),
            h("span", {}, h("span", { class: "key-rect", style: "background:" + css("--wash-critical") }), "фриз у плеера (оценка)"),
            h("span", {}, h("span", { class: "key-rect", style: "background:" + css("--wash-hold") }), "пауза-добор"));
  el.append(lg, f.svg);
}

// ---------- columns: lateness per segment vs protection
function latenessChart(el, d) {
  el.replaceChildren();
  const recs = d.segments.filter(r => !r.init).slice(-150);
  const live = recs.filter(r => !r.failed);
  if (live.length < 2) { el.append(h("div", { class: "muted", text: "Нужно несколько сегментов эфира" })); return; }
  const qmin = Math.min(...live.map(r => r.q));
  const have = d.diag.have_s;
  const yMax = niceMax(Math.max(have, ...live.map(r => r.q - qmin)) * 1.1);
  const f = frame(el, 200, yMax, "с");
  const n = recs.length, slot = f.iw / n, bw = Math.max(1, Math.min(24, slot - 2));
  recs.forEach((r, i) => {
    const cx = f.m.l + slot * i + slot / 2;
    let el2;
    if (r.failed) {
      el2 = s("rect", { x: cx - bw / 2, y: f.m.t, width: bw, height: f.ih, fill: css("--wash-critical") });
    } else {
      const v = r.q - qmin, over = v > have;
      const top = f.y(Math.min(v, yMax)), hgt = Math.max(1, f.m.t + f.ih - top);
      const rr = Math.min(4, bw / 2, hgt);
      const x0 = cx - bw / 2, x1 = cx + bw / 2, yb = f.m.t + f.ih;
      el2 = s("path", { d: `M${x0} ${yb} V${top + rr} Q${x0} ${top} ${x0 + rr} ${top} H${x1 - rr} Q${x1} ${top} ${x1} ${top + rr} V${yb} Z`, fill: over ? css("--critical") : css("--series-1") });
    }
    const hit = s("rect", { x: cx - slot / 2, y: f.m.t, width: slot, height: f.ih, fill: "transparent" });
    hit.addEventListener("pointermove", ev => {
      const rows = r.failed ? [{ name: "Сегмент", value: r.gap ? "потерян у провайдера" : "не скачался" }]
        : [{ name: "Опоздание", value: fmt(r.q - qmin, 1) + " с" }, { name: "Скорость", value: "×" + fmt(r.x, 2) },
           { name: "Ожидание старта", value: fmt(r.wait, 1) + " с" }, { name: "Битрейт", value: fmt(r.mbps, 1) + " Мбит/с" },
           { name: "Попыток", value: String(r.tries) }];
      showTip(ev, clock(r.t) + (r.id >= 0 ? " · сегм. " + r.id : ""), rows);
    });
    hit.addEventListener("pointerleave", hideTip);
    f.svg.append(el2, hit);
  });
  refLine(f, Math.min(have, yMax), "защита " + fmt(have) + " с", css("--text-secondary"));
  const lg = h("div", { class: "legend" },
    h("span", {}, h("span", { class: "key-rect", style: "background:" + css("--series-1") }), "опоздание сегмента (укладывается в защиту)"),
    h("span", {}, statusBadge("critical", "превысило защиту → фриз")),
    h("span", {}, h("span", { class: "key-rect", style: "background:" + css("--wash-critical") }), "сегмент потерян"));
  el.append(lg, f.svg);
}

// ---------- download speed vs realtime
function speedChart(el, d) {
  el.replaceChildren();
  const recs = d.segments.filter(r => !r.failed && r.x > 0).slice(-150);
  if (recs.length < 2) { el.append(h("div", { class: "muted", text: "Нужно несколько сегментов" })); return; }
  const yMax = niceMax(Math.max(2, ...recs.map(r => Math.min(r.x, 20))) * 1.05);
  const f = frame(el, 200, yMax, "×");
  const x0 = recs[0].t, x1 = recs[recs.length - 1].t;
  const x = t => f.m.l + (t - x0) / Math.max(1, x1 - x0) * f.iw;
  const y1 = f.y(1);
  f.svg.append(s("line", { x1: f.m.l, x2: f.W - f.m.r, y1: y1, y2: y1, stroke: css("--critical"), "stroke-width": 1 }));
  const col = css("--series-1");
  for (const r of recs) {
    const cy = f.y(Math.min(r.x, yMax));
    const dot = s("circle", { cx: x(r.t), cy, r: 4, fill: r.x < 1 ? css("--critical") : col, stroke: css("--surface-1"), "stroke-width": 2 });
    const hit = s("circle", { cx: x(r.t), cy, r: 12, fill: "transparent" });
    hit.addEventListener("pointermove", ev => showTip(ev, clock(r.t) + " · сегм. " + r.id, [
      { name: "× реалтайм", value: "×" + fmt(r.x, 2), color: col }, { name: "Размер", value: fmt(r.kb / 1024, 1) + " МБ" },
      { name: "Попыток", value: String(r.tries) }]));
    hit.addEventListener("pointerleave", hideTip);
    f.svg.append(dot, hit);
  }
  const lg = h("div", { class: "legend" },
    h("span", {}, h("span", { class: "key-rect", style: "border-radius:50%;background:" + col }), "сегмент"),
    h("span", {}, h("span", { class: "key-line", style: "background:" + css("--critical") }), "×1 — скачался ровно за время своего воспроизведения"),
    h("span", {}, statusBadge("critical", "медленнее воспроизведения")));
  el.append(lg);
  xTicks(f, x0, x1, x);
  el.append(f.svg);
}

// ---------- protection meter
function meter(el, d) {
  el.replaceChildren();
  const g = d.diag;
  const top = niceMax(Math.max(g.need_s * 1.25 + d.seg_dur_s, g.have_s, g.avail_s + d.seg_dur_s * 3, 10) * 1.05);
  const W = Math.max(300, el.clientWidth || 600), H = 64, l = 0, r = 0, iw = W - l - r;
  const x = v => l + Math.min(v, top) / top * iw;
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" });
  const ok = g.have_s >= g.need_s * 1.25 || g.verdict === "ok";
  const fill = g.verdict === "learning" ? css("--series-1") : ok ? css("--good") : (g.level === "critical" ? css("--critical") : css("--warning"));
  svg.append(s("rect", { x: l, y: 22, width: iw, height: 12, rx: 4, fill: css("--surface-2") }));
  svg.append(s("rect", { x: l, y: 22, width: Math.max(4, x(g.have_s) - l), height: 12, rx: 4, fill }));
  const mark = (v, label, color, up) => {
    const xx = x(v);
    svg.append(s("line", { x1: xx, x2: xx, y1: up ? 14 : 22, y2: up ? 34 : 42, stroke: color, "stroke-width": 2 }));
    const t = s("text", { x: Math.min(Math.max(xx, 30), W - 30), y: up ? 10 : 56, "text-anchor": "middle", "font-size": 11, fill: css("--text-secondary") });
    t.textContent = label; svg.append(t);
  };
  if (g.verdict !== "learning") mark(g.need_s, "нужно " + fmt(g.need_s) + " с", css("--text-primary"), true);
  mark(g.avail_s + d.seg_dur_s * 3, "окно провайдера ≈" + fmt(g.avail_s + d.seg_dur_s * 3) + " с", css("--text-muted"), false);
  if (g.max_s < top) mark(g.max_s, "max_delay " + fmt(g.max_s) + " с", css("--text-muted"), false);
  el.append(svg);
}

// ---------- render
function tile(lb, vl, sub) { return h("div", { class: "card tile" }, h("div", { class: "lb", text: lb }), h("div", { class: "vl", text: vl }), sub ? h("div", { class: "sub", text: sub }) : null); }

function renderList() {
  const st = state.status, list = $("#list");
  list.replaceChildren();
  if (!st || !st.channels.length) { list.append(h("div", { class: "card muted", text: "Каналов нет" })); return; }
  if (!state.sel || !st.channels.find(c => c.id === state.sel)) state.sel = st.channels[0].id;
  for (const c of st.channels) {
    const b = h("button", { class: "card ch", "aria-current": String(c.id === state.sel), onclick: () => { state.sel = c.id; state.detail = null; renderList(); refresh(); } },
      h("div", { class: "nm", text: c.name, title: c.source }),
      statusBadge(c.diag.level, c.diag.title),
      h("div", { class: "muted", style: "font-size:12px;margin-top:4px", text:
        `защита ${fmt(c.diag.have_s)} с · нужно ${fmt(c.diag.need_s)} с · фризов ${c.stats.Freezes}` + (c.idle_s > 15 ? " · не смотрят" : "") }));
    list.append(b);
  }
}

function renderDetail() {
  const d = state.detail, root = $("#detail");
  if (!d) return;
  const g = d.diag, [ic, cls] = LV[g.level] || LV.info;
  root.classList.remove("stale");
  root.replaceChildren();

  // verdict
  const v = h("div", { class: "card" },
    h("div", { class: "muted", text: d.name + " · " + d.source }),
    h("div", { class: "verdict-title status " + cls }, h("i", { text: ic, "aria-hidden": "true" }), h("span", { text: g.title })));
  const ul = h("ul", { class: "reasons" }); for (const r of g.reasons || []) ul.append(h("li", { text: r })); v.append(ul);
  const m = h("div", { class: "meter" }); v.append(h("div", { style: "margin-top:10px" }, h("div", { class: "sec", style: "font-size:12px", text: "Защита от провалов, секунд" }), m));
  // recommendation & apply
  if (g.verdict !== "learning") {
    const inD = h("input", { class: "num", type: "number", min: "0", max: String(g.max_s), value: String(Math.max(g.rec_delay, 0)) });
    const inC = h("input", { class: "num", type: "number", min: "1", max: "6", value: String(g.rec_conc) });
    const msg = h("span", { class: "muted" });
    const apply = h("button", { class: "btn primary", text: "Применить для канала", onclick: async () => {
      apply.disabled = true;
      try {
        const r = await fetch("api/channel/" + d.id + "/apply", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ delay: Number(inD.value), concurrency: Number(inC.value) }) });
        msg.textContent = r.ok ? "Сохранено в профиль канала. delay сработает при следующем включении канала." : "Ошибка " + r.status;
      } catch (e) { msg.textContent = "Ошибка: " + e; }
      apply.disabled = false;
    }});
    const forget = h("button", { class: "btn", text: "Сбросить профиль", onclick: async () => {
      await fetch("api/channel/" + d.id + "/forget", { method: "POST" }); msg.textContent = "Профиль удалён";
    }});
    v.append(h("div", { class: "rec" },
      h("span", {}, h("b", { text: "Рекомендовано: " }), "delay "), inD, h("span", { text: "с, потоков" }), inC,
      g.rec_ram_mb ? h("span", { class: "muted", text: "· RAM ≈ " + g.rec_ram_mb + " МБ" }) : null, apply, forget, msg));
    const pr = d.profile;
    v.append(h("div", { class: "muted", style: "font-size:12px;margin-top:8px", text:
      "Сейчас у канала: delay " + fmt(d.delay_param_s) + " с, потоков " + d.concurrency +
      (pr ? ` · профиль: delay ${pr.delay} с, потоков ${pr.concurrency}${pr.manual ? " (задан вручную)" : ""}, сеансов ${pr.sessions}, обновлён ${pr.updated}` : " · профиля пока нет") }));
  }
  root.append(v);
  meter(m, d);

  // tiles
  const sx = d.stats;
  const tiles = h("div", { class: "tiles" },
    tile("Отставание плеера от эфира", "≈" + fmt(d.delay_s + d.client_buf_s) + " с", "в RAM роутера " + fmt(d.delay_s) + " с, у плеера ≈" + fmt(d.client_buf_s) + " с"),
    tile("Скачанный запас", fmt(d.ready_ahead_s) + " с", d.holding ? "идёт пауза-добор" : d.stall ? "край ждёт сегмент" : "впереди края плеера"),
    tile("Буфер плеера (оценка)", fmt(d.client_buf_s) + " с", d.idle_s > 15 ? "плеер не запрашивает" : d.client_playing ? "играет" : "буферизация"),
    tile("Ёмкость канала", g.cap_x < 0 ? "с запасом" : "×" + fmt(g.cap_x, 2), "загрузчик занят " + fmt(g.busy_pct) + "% времени"),
    tile("Битрейт потока", fmt(g.bitrate_mbps, 1) + " Мбит/с", "сегмент " + fmt(d.seg_dur_s, 1) + " с, потоков " + d.concurrency),
    tile("Фризов у плеера", String(sx.Freezes), "оценка, всего " + fmt(sx.FreezeS) + " с"),
    tile("Пауз-добора", String(sx.Holds), fmt(sx.HoldS) + " с суммарно"),
    tile("Потеряно сегментов", String(sx.Skipped + sx.Gaps), "ретраев " + sx.Retries));
  root.append(tiles);

  const c1 = h("div", { class: "chart" }), c2 = h("div", { class: "chart" }), c3 = h("div", { class: "chart" });
  root.append(h("div", { class: "card" }, h("h2", { text: "Запас и потребность" }), c1));
  root.append(h("div", { class: "grid2" },
    h("div", { class: "card" }, h("h2", { text: "Опоздание сегментов относительно лучшего случая" }), c2),
    h("div", { class: "card" }, h("h2", { text: "Скорость скачивания сегментов, × реального времени" }), c3)));
  reserveChart(c1, d); latenessChart(c2, d); speedChart(c3, d);

  // events
  const evs = h("div", { class: "events" });
  const ek = { info: "info", warn: "warning", crit: "critical", tune: "good" };
  for (const e of [...d.events].reverse()) {
    const [ic2, cls2] = LV[ek[e.kind]] || LV.info;
    evs.append(h("div", { class: "ev" }, h("span", { class: "tm", text: e.at }),
      h("span", { class: "status " + cls2 }, h("i", { text: e.kind === "tune" ? "⚙" : ic2, title: e.kind })), h("span", { text: e.text })));
  }
  root.append(h("div", { class: "card" }, h("h2", { text: "События" }), evs));

  // table view
  const tb = h("table", { class: "data" });
  tb.append(h("tr", {}, ...["Время", "Сегм.", "Длит., с", "МБ", "Мбит/с", "× реалтайм", "Опоздание, с", "Попыток", ""].map(t => h("th", { text: t }))));
  const live = d.segments.filter(r => !r.init && !r.failed);
  const qmin = live.length ? Math.min(...live.map(r => r.q)) : 0;
  for (const r of d.segments.slice(-60).reverse()) {
    tb.append(h("tr", {}, ...[clock(r.t), r.id >= 0 ? r.id : "—", fmt(r.dur, 1), fmt(r.kb / 1024, 1), fmt(r.mbps, 1), r.failed ? "—" : fmt(r.x, 2),
      r.failed || r.init ? "—" : fmt(r.q - qmin, 1), r.tries || "—", r.failed ? (r.gap ? "потерян у провайдера" : "не скачан") : r.init ? "стартовое окно" : ""].map(t => h("td", { text: String(t) }))));
  }
  root.append(h("details", { class: "card" }, h("summary", { text: "Таблица последних сегментов" }), tb));
}

async function refresh() {
  if (state.busy) return; state.busy = true;
  try {
    const st = await (await fetch("api/status", { cache: "no-store" })).json();
    state.status = st;
    $("#ver").textContent = "v" + st.version;
    $("#mode").textContent = MODES[st.mode] || st.mode;
    $("#conn").textContent = "";
    renderList();
    if (state.sel) {
      $("#detail").classList.add("stale");
      const r = await fetch("api/channel/" + state.sel, { cache: "no-store" });
      if (r.ok) { state.detail = await r.json(); renderDetail(); }
    } else {
      $("#detail").replaceChildren(h("div", { class: "card empty", text: "Нет активных каналов. Включите канал в плеере — он появится здесь." }));
    }
  } catch (e) {
    $("#conn").textContent = "нет связи с прокси";
  } finally { state.busy = false; }
}
let hovering = false;
document.addEventListener("pointerover", e => { hovering = !!e.target.closest("svg"); });
setInterval(() => { if (!hovering) refresh(); }, 2000);
window.addEventListener("resize", () => state.detail && renderDetail());
refresh();
</script>
</body>
</html>
